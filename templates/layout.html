<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "推し活掲示板" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header>
    <h1>
      <a href="{{ url_for('boards') }}" style="text-decoration:none; color:inherit;">
        💖 推し活掲示板 💖
      </a>
    </h1>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- 🔽 共通：トップに戻るボタン -->
  <div style="margin: 20px; text-align: center;">
    <a href="{{ url_for('index') }}" style="text-decoration:none;">
      <button type="button" style="padding:8px 16px; cursor:pointer;">
        🏠 トップに戻る
      </button>
    </a>
  </div>

  <footer style="text-align:center; margin: 2em 0; font-size: 0.9em; color: #777;">
    &copy; 2025 推し活掲示板
  </footer>

</body>
</html>
