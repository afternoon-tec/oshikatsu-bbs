{% extends "layout.html" %}
{% block content %}
<h2>📋 板一覧</h2>

{% if boards %}
  <ul>
    {% for board in boards %}
      <li>
        <a href="{{ url_for('board', board_id=board.id) }}">{{ board.title }}</a>
        {% if board.description %}
          <p class="description">{{ board.description }}</p>
        {% endif %}
        <form action="{{ url_for('delete_board', board_id=board.id) }}" method="POST" style="display:inline;">
          <button type="submit" class="delete-btn" onclick="return confirm('本当に削除しますか？');">🗑</button>
        </form>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>まだ板がありません。</p>
{% endif %}

<h3>＋ 新しい板を作る</h3>
<form action="{{ url_for('create_board') }}" method="POST">
  <input type="text" name="name" placeholder="板の名前" required>
  <input type="text" name="description" placeholder="説明（任意）">
  <button type="submit">作成</button>
</form>
{% endblock %}
